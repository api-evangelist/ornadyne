aid: ornadyne
name: Ornadyne
description: >-
  Ornadyne is a Los Angeles hard-tech startup building autonomous flapping-wing
  UAVs (ornithopters) that look and fly like real birds for covert reconnaissance
  and surveillance. Its near-silent, AI-powered, man-portable drones are engineered
  for low acoustic and visual signatures, hour-class flight times, and natural
  bird-like flight, contrasting with easily detected quadcopters and fixed-wing
  aircraft. Founded by Geourg Kivijian (CEO, ex-NASA JPL and Astrolab) and Armen
  Arakelyan (CTO, ex-SpaceX Starship), the company is a Y Combinator Spring 2026
  company operating in the hardware, robotics, drones, aerospace, and defense space.
  It is a hardware/defense company with a marketing website and no public developer
  API surface at this time.
